name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: Update dependencies
        run: moon update
      - name: Check
        run: moon check --target native --deny-warn
      - name: Test
        run: moon test --target native
      - name: Build
        run: moon build --target native
      - name: Registry HTTP smoke test
        run: bash -x examples/registry-smoke.sh
      - name: Format
        run: |
          moon fmt
          git diff --exit-code
